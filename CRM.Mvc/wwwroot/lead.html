<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kurumsal Çözüm Başvuru ve İletişim Portalı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card-custom {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.1);
        }

        .btn-success-custom {
            background-color: #198754;
            border-color: #198754;
            transition: all 0.3s ease;
        }

            .btn-success-custom:hover {
                background-color: #157347;
                border-color: #146c43;
                transform: translateY(-2px);
            }

        .header-icon {
            font-size: 3rem;
            color: #198754;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card card-custom p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-check header-icon mb-2"></i>
                        <h2 class="fw-bold text-success">Müşteri Kayıt ve Bilgi Portalı</h2>
                        <p class="text-muted">Bilgilerinizi girin, anında CRM sistemimize ve veri tabanımıza kaydedilsin.</p>
                    </div>

                    <div id="alertBox" class="alert d-none" role="alert"></div>

                    <form id="leadForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Adınız</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-success"><i class="bi bi-person"></i></span>
                                <input type="text" id="Ad" class="form-control" placeholder="Örn: Yusuf" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Soyadınız</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-success"><i class="bi bi-person-fill"></i></span>
                                <input type="text" id="Soyad" class="form-control" placeholder="Örn: Gökerti" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Telefon Numarası</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-success"><i class="bi bi-telephone"></i></span>
                                <input type="tel" id="Telefon" class="form-control" placeholder="05XX XXX XX XX" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">E-posta Adresi</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-success"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="Eposta" class="form-control" placeholder="ornek@domain.com">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Başvuru / İlgi Kaynağı</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-success"><i class="bi bi-globe"></i></span>
                                <input type="text" id="Kaynak" class="form-control" value="Web Sitesi Formu" readonly>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success-custom btn-lg text-white fw-bold shadow-sm">
                                <i class="bi bi-send-check"></i> Bilgileri Gönder ve Kaydet
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('leadForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const adInput = /** @type {HTMLInputElement | null} */ (document.getElementById('Ad'));
            const soyadInput = /** @type {HTMLInputElement | null} */ (document.getElementById('Soyad'));
            const telefonInput = /** @type {HTMLInputElement | null} */ (document.getElementById('Telefon'));
            const epostaInput = /** @type {HTMLInputElement | null} */ (document.getElementById('Eposta'));
            const kaynakInput = /** @type {HTMLInputElement | null} */ (document.getElementById('Kaynak'));
            const alertBox = document.getElementById('alertBox');

            const formData = {
                Ad: adInput ? adInput.value : '',
                Soyad: soyadInput ? soyadInput.value : '',
                Telefon: telefonInput ? telefonInput.value : '',
                Eposta: epostaInput ? epostaInput.value : '',
                MusteriDurumu: 'Potansiyel',
                Kaynak: kaynakInput ? kaynakInput.value : 'Web Sitesi Formu'
            };

            try {
                const response = await fetch('https://localhost:7286/api/Musteri', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    if (alertBox) {
                        alertBox.className = 'alert alert-success';
                        alertBox.textContent = 'Başvurunuz başarıyla alındı! Bilgileriniz anında CRM veritabanına işlendi.';
                        alertBox.classList.remove('d-none');
                    }
                    const form = /** @type {HTMLFormElement | null} */ (document.getElementById('leadForm'));
                    if (form) form.reset();
                } else {
                    throw new Error('Kayıt sırasında bir hata oluştu.');
                }
            } catch (error) {
                if (alertBox) {
                    alertBox.className = 'alert alert-danger';
                    alertBox.textContent = 'Bağlantı hatası! Lütfen API servisinizin açık olduğundan emin olun.';
                    alertBox.classList.remove('d-none');
                }
            }
        });
    </script>
</body>
</html>
